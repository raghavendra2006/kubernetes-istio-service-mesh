##################################################################################################
# Bookinfo Sample Application - Kubernetes Manifests
# 
# This file deploys the four core microservices of the Istio Bookinfo application:
#   1. productpage (v1) - The frontend web UI (Python)
#   2. details (v1)     - Book detail information service (Ruby)
#   3. reviews (v1,v2,v3) - Book review service with 3 versions (Java)
#   4. ratings (v1)     - Star-rating service (Node.js)
#
# When deployed to a namespace with istio-injection=enabled, each pod will
# automatically receive an Envoy sidecar proxy (2/2 containers).
##################################################################################################

# ================================
# Details Service & Deployment
# ================================
apiVersion: v1
kind: Service
metadata:
  name: details
  labels:
    app: details
    service: details
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: details
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-details
  labels:
    account: details
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: details-v1
  labels:
    app: details
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: details
      version: v1
  template:
    metadata:
      labels:
        app: details
        version: v1
    spec:
      serviceAccountName: bookinfo-details
      containers:
      - name: details
        image: docker.io/istio/examples-bookinfo-details-v1:1.20.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9080
        readinessProbe:
          tcpSocket:
            port: 9080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---

